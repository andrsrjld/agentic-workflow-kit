# .agentic/config.yml — per-project Agentic Workflow Kit manifest
# ---------------------------------------------------------------------------
# Single source of truth for everything that used to be hardcoded in scripts,
# hooks, agents, and commands. Generic kit tooling READS this file (with
# auto-detect fallbacks) so the same scripts work in every repo.
#
# This file is GIT-TRACKED. Machine-specific overrides go in
# `.agentic/config.local.yml` (gitignored) and are deep-merged on top.
#
# `/agentic-init` generates this for you by auto-detecting the project; review
# and commit it. Any field left blank falls back to auto-detection at runtime.
# ---------------------------------------------------------------------------

project:
  name: my-project                 # short slug; used as the memory namespace root
  repo: ""                          # owner/name — auto-detected from `git remote get-url origin`
  type: single-app                  # single-app | monorepo

# Package manager — auto: read packageManager field / detect lockfile
# (pnpm-lock.yaml->pnpm, yarn.lock->yarn, bun.lockb->bun, package-lock.json->npm)
package_manager: ""                 # "" = auto-detect | pnpm | npm | yarn | bun

# Monorepo settings (ignored when project.type = single-app)
monorepo:
  tool: ""                          # "" = auto (turbo.json->turbo, nx.json->nx, lerna.json->lerna) | turbo | nx | lerna | none
  workspaces: []                    # e.g. [apps/*, packages/*]; "" = read from package.json workspaces / pnpm-workspace.yaml

# Branch model — auto-detected from `git symbolic-ref` / remote HEAD when blank
branches:
  integration: ""                   # PRs target this (e.g. develop / development / main); "" = auto
  primary: ""                       # production-tracking branch (e.g. main / master); "" = auto

# Local DEV deploy (never production). Used by the deploy gate + smoke test.
deploy:
  dev_command: ""                   # e.g. scripts/deploy-dev.sh or "docker compose up -d --build --wait"; "" disables deploy gate
  health_url: ""                    # smoke check, e.g. http://localhost:4000/health; "" skips health smoke
  smoke_user: ""                    # seeded login used by smoke E2E, e.g. demo@example.com

# Foundation files agents must NOT modify without an explicit reviewed task.
protected_paths: []                 # globs, e.g. [src/styles/globals.css, src/lib/*, src/components/ui/*]

# Project conventions surfaced to code/review agents.
conventions:
  page_pattern: ""                  # e.g. "src/app/(app)/[page-id]/page.tsx"; "" = none
  shared_types: ""                  # e.g. "@myproject/contracts"; "" = none
  notes: ""                         # any one-line convention reminder for agents

# Multi-tenant scoping. EMPTY list disables all tenant checks for
# single-tenant / non-SaaS projects (review + security agents skip them).
tenant:
  scope_fields: []                  # e.g. [userId, tenantId, familyGroupId]

# Guardrail hook config.
guardrail:
  override_env: AGENTIC_OVERRIDE    # env var that, when =1, bypasses a guardrail block for a reviewed exception

# Gate scripts (relative to repo root). The kit ships generic versions.
gates:
  qa: scripts/qa.sh                 # lint + static checks
  test: scripts/test.sh             # install + build/type-check + unit tests
  security: scripts/security-check.sh  # secrets, env files, destructive SQL, dep audit

# Loop engineering control plane. Disabled by default: enabling a loop never
# grants permission to push, open PRs, deploy, or mutate third-party systems.
# L1 is report-only; L2 may prepare a patch in an isolated worktree but always
# stops at the human gate. L3 unattended mutation is intentionally unsupported.
loop:
  enabled: false                     # opt in only after `bash scripts/loop-readiness.sh`
  pattern: daily-triage              # daily-triage | issue-triage | ci-sweeper | dependency-sweeper | changelog-drafter | post-merge-cleanup | pr-babysitter
  level: L1                          # L1 report-only | L2 assisted
  mode: report-only                  # report-only (L1) | assisted (L2)
  cadence: manual                    # document the host scheduler; this kit does not schedule by itself
  state_file: docs/LOOP-STATE.md     # human-readable current queue and overrides
  run_log: docs/LOOP-RUN-LOG.md      # append-only, durable run observability
  ledger: .agentic/loop-ledger.tsv   # local counters for mechanical cap enforcement
  constraints_file: .agentic/loop-constraints.md
  kill_switch: .agentic/loop.pause   # local file; creating it stops the next run
  max_attempts_per_item: 3
  max_runs_per_day: 1
  token_budget_per_day: 100000
  max_subagents_per_run: 0
  worktree_required: true            # mandatory before an L2 patch attempt
  verifier_required: true            # maker and checker must be separate at L2
  human_gate: required               # required before every remote or irreversible action

# Self-learning memory.
memory:
  enabled: true                     # false = pure no-op (no AgentDB/Ruflo calls anywhere)
  namespace: ""                     # "" = use project.name; memory keys are <namespace>[:<branch>][:<epic>]
  warm_start: true                  # SessionStart hook injects top-K relevant memory
  top_k: 8                          # how many patterns to recall on warm start

# Docs source-of-truth locations (standard set). Kept relative to repo root.
docs:
  root: docs
  prd: docs/product/PRD.md
  stories: docs/product/USER-STORIES.md
  acceptance: docs/product/ACCEPTANCE-CRITERIA.md
  tasks: docs/product/ENGINEERING-TASKS.md
  backlog: docs/BACKLOG.md
  epics: docs/epics
  definition_of_done: docs/DEFINITION-OF-DONE.md
